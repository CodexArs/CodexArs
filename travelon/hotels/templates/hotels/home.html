<script>
    new Autocomplete('#autocomplete', {
        search: input => {
            console.log(input)
            const URL = `search-hotels/?name=${input}`
            return new Promise(resolve => {
                fetch(URL).then(response => response.json())
                    .then(data => {
                        console.log(data)
                        resolve(data.data)
                    })
            })
        },
        onSubmit: result => {
            window.open(`list/${result}`)
        }
    })

    $(function () {
        $("#{{ widget.datetimepicker_id }}").datetimepicker({
            format: 'DD/MM/YYYY HH:mm',
        });
    });

</script>
